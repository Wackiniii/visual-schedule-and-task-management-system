<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KiddoPath — Dashboard</title>
  <link href="css/style.css" rel="stylesheet" />
  <style>
    .glass-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(30, 41, 59, 0.35);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      z-index: 1500;
    }
    .glass-backdrop.open { display: flex; }
    .glass-dialog {
      width: 100%;
      max-width: 540px;
      background: rgba(255, 255, 255, 0.94);
      border: 1.5px solid #ffffff;
      border-radius: 26px;
      padding: 1.75rem;
      box-shadow: 0 24px 60px rgba(30, 41, 59, 0.2);
    }
  </style>
</head>
<body>

  <header id="appNavbar"></header>

  <main class="container py-4">

    <section class="glass-card p-4 mb-4 d-flex flex-wrap align-items-center justify-content-between gap-3">
      <div>
        <span class="badge-pastel badge-sky mb-2">Care Team Overview</span>
        <h1 class="h3 mb-1" id="welcomeHeading">Welcome back!</h1>
        <p class="text-secondary mb-0">Manage child profiles, build visual schedules, and launch interactive child sessions.</p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" id="openAddChildBtn" class="btn-pastel btn-pastel-sky">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add Child Profile</span>
        </button>
        <a href="schedule-creator.html" class="btn-pastel btn-pastel-glass">
          <span>Build Schedule</span>
        </a>
      </div>
    </section>

    <section class="row mb-4">
      <div class="col-md-4">
        <div class="glass-card p-4 d-flex align-items-center gap-3">
          <div class="pastel-icon-tile tile-sky">
            <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div>
            <div class="small fw-bold text-secondary">Child Profiles</div>
            <div class="h3 mb-0" id="statChildrenCount">0</div>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="glass-card p-4 d-flex align-items-center gap-3">
          <div class="pastel-icon-tile tile-lavender">
            <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          </div>
          <div>
            <div class="small fw-bold text-secondary">Total Schedules</div>
            <div class="h3 mb-0" id="statSchedulesCount">0</div>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="glass-card p-4 d-flex align-items-center gap-3">
          <div class="pastel-icon-tile tile-mint">
            <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
          </div>
          <div>
            <div class="small fw-bold text-secondary">Tasks Completed Today</div>
            <div class="h3 mb-0" id="statCompletedToday">0 / 0</div>
          </div>
        </div>
      </div>
    </section>

    <div class="d-flex align-items-center justify-content-between mb-3">
      <h2 class="h3 mb-0" style="font-size: 1.35rem;">Your Child Profiles</h2>
      <span class="small text-secondary" id="todayDateLabel"></span>
    </div>

    <section id="childrenGrid" class="row">
      <div class="col-12">
        <div class="glass-card p-5 text-center text-secondary">Loading child profiles...</div>
      </div>
    </section>

  </main>

  <div id="childModalBackdrop" class="glass-backdrop" role="dialog" aria-modal="true" aria-labelledby="childModalTitle">
    <div class="glass-dialog">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="h3 mb-0" id="childModalTitle" style="font-size: 1.35rem;">Add Child Profile</h3>
        <button type="button" id="closeChildModalBtn" class="btn-pastel btn-pastel-glass" style="min-height: 40px; padding: 0.35rem 0.85rem;">&times;</button>
      </div>

      <div id="childFormAlert" class="alert-box d-none"></div>

      <form id="childForm" novalidate>
        <input type="hidden" id="childIdInput" />

        <div class="row" style="margin: -0.45rem;">
          <div class="col-md-8" style="padding: 0.45rem;">
            <label for="childNameInput" class="glass-label">Child's Name *</label>
            <input type="text" id="childNameInput" class="glass-input" placeholder="e.g., Leo" required />
          </div>
          <div class="col-md-4" style="padding: 0.45rem;">
            <label for="childAgeInput" class="glass-label">Age (Years) *</label>
            <input type="number" id="childAgeInput" class="glass-input" min="1" max="18" placeholder="5" required />
          </div>
        </div>

        <div class="mt-3">
          <label for="childDomainInput" class="glass-label">Primary Developmental / Delay Domain</label>
          <select id="childDomainInput" class="glass-select">
            <option value="Speech & Language Delay">Speech &amp; Language Delay</option>
            <option value="Autism Spectrum Support">Autism Spectrum Support</option>
            <option value="Global Developmental Delay">Global Developmental Delay</option>
            <option value="Sensory Processing & Motor">Sensory Processing &amp; Motor</option>
            <option value="Social & Emotional Regulation">Social &amp; Emotional Regulation</option>
          </select>
        </div>

        <div class="mt-3">
          <label for="childPhotoInput" class="glass-label">Avatar Photo URL (Optional)</label>
          <input type="url" id="childPhotoInput" class="glass-input" placeholder="https://example.com" />
        </div>

        <div class="mt-3 mb-4">
          <label for="childNotesInput" class="glass-label">Sensory Preferences &amp; Therapy Notes</label>
          <textarea id="childNotesInput" class="glass-textarea" placeholder="e.g., Prefers visual timers, responds well to calm praise and picture cues."></textarea>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button type="button" id="cancelChildModalBtn" class="btn-pastel btn-pastel-glass">Cancel</button>
          <button type="submit" id="saveChildBtn" class="btn-pastel btn-pastel-sky">Save Profile</button>
        </div>
      </form>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/script.js"></script>
  <script>
    const currentUser = requireAuth();
    renderGlassNavbar('dashboard');

    if (currentUser) {
      document.getElementById('welcomeHeading').textContent = `Welcome back, ${currentUser.name}!`;
    }

    document.getElementById('todayDateLabel').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long',
      month: 'short',
      day: 'numeric',
      year: 'numeric',
    });

    let childrenList = [];

    const childrenGrid = document.getElementById('childrenGrid');
    const modalBackdrop = document.getElementById('childModalBackdrop');
    const childForm = document.getElementById('childForm');
    const childFormAlert = document.getElementById('childFormAlert');

    function openChildModal(child = null) {
      childFormAlert.classList.add('d-none');
      if (child) {
        document.getElementById('childModalTitle').textContent = 'Edit Child Profile';
        document.getElementById('childIdInput').value = child.id;
        document.getElementById('childNameInput').value = child.name || '';
        document.getElementById('childAgeInput').value = child.age || '';
        document.getElementById('childDomainInput').value = child.delay_domain || 'Speech & Language Delay';
        document.getElementById('childPhotoInput').value = child.photo_url || '';
        document.getElementById('childNotesInput').value = child.notes || '';
      } else {
        document.getElementById('childModalTitle').textContent = 'Add Child Profile';
        childForm.reset();
        document.getElementById('childIdInput').value = '';
      }
      modalBackdrop.classList.add('open');
    }

    function closeChildModal() {
      modalBackdrop.classList.remove('open');
    }

    document.getElementById('openAddChildBtn').addEventListener('click', () => openChildModal(null));
    document.getElementById('closeChildModalBtn').addEventListener('click', closeChildModal);
    document.getElementById('cancelChildModalBtn').addEventListener('click', closeChildModal);
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeChildModal();
    });

    function renderAvatar(child) {
      if (child.photo_url && child.photo_url.trim()) {
        return `<img src="${escapeHtml(child.photo_url)}" alt="${escapeHtml(child.name)}" class="child-avatar" onerror="this.style.display='none'" />`;
      }
      const initial = (child.name || 'C').trim().charAt(0).toUpperCase();
      return `<div class="child-avatar">${escapeHtml(initial)}</div>`;
    }

    async function loadDashboard() {
      if (!currentUser) return;
      try {
        childrenList = await ChildrenAPI.getAll(currentUser.id);
        document.getElementById('statChildrenCount').textContent = childrenList.length;

        if (childrenList.length === 0) {
          document.getElementById('statSchedulesCount').textContent = '0';
          document.getElementById('statCompletedToday').textContent = '0 / 0';
          childrenGrid.innerHTML = `
            <div class="col-12">
              <div class="glass-card p-5 text-center">
                <div class="pastel-icon-tile tile-sky mb-3" style="width:64px;height:64px;border-radius:20px;">
                  <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </div>
                <h3 class="h3 mb-2" style="font-size:1.35rem;">No child profiles yet</h3>
                <p class="text-secondary mb-4">Add your first child profile to start creating visual daily schedules and talking boards.</p>
                <button type="button" class="btn-pastel btn-pastel-sky" onclick="openChildModal(null)">Add First Child</button>
              </div>
            </div>
          `;
          return;
        }
        const today = getTodayISO();
        let totalSchedules = 0;
        let todayTotalTasks = 0;
        let todayDoneTasks = 0;
        const perChildStats = {};

        await Promise.all(
          childrenList.map(async (child) => {
            const schedules = await SchedulesAPI.getByChild(currentUser.id, child.id);
            totalSchedules += schedules.length;

            const todaySchedule = schedules.find((s) => s.date === today);
            if (todaySchedule) {
              const tasks = await TasksAPI.getBySchedule(currentUser.id, todaySchedule.id);
              const done = tasks.filter((t) => t.status === 'completed').length;
              todayTotalTasks += tasks.length;
              todayDoneTasks += done;
              perChildStats[child.id] = { total: tasks.length, done };
            } else {
              perChildStats[child.id] = { total: 0, done: 0 };
            }
          })
        );

        document.getElementById('statSchedulesCount').textContent = totalSchedules;
        document.getElementById('statCompletedToday').textContent = `${todayDoneTasks} / ${todayTotalTasks}`;

        childrenGrid.innerHTML = childrenList
          .map((child) => {
            const stats = perChildStats[child.id] || { total: 0, done: 0 };
            const domain = child.delay_domain || 'General Support';
            const notes = child.notes || 'No specific sensory notes added yet.';

            return `
              <div class="col-md-6 col-lg-4">
                <div class="glass-card glass-card-hover p-4 h-100 d-flex flex-column justify-content-between">
                  <div>
                    <div class="d-flex align-items-center gap-3 mb-3">
                      ${renderAvatar(child)}
                      <div>
                        <h3 class="h3 mb-1" style="font-size: 1.25rem;">${escapeHtml(child.name)}</h3>
                        <span class="badge-pastel badge-sky">Age ${escapeHtml(child.age)} yrs</span>
                      </div>
                    </div>

                    <div class="mb-3">
                      <span class="badge-pastel badge-lavender">${escapeHtml(domain)}</span>
                    </div>

                    <p class="small text-secondary mb-3">${escapeHtml(notes)}</p>
                  </div>

                  <div>
                    <div class="glass-panel-subtle p-3 mb-3 d-flex align-items-center justify-content-between">
                      <span class="small fw-semibold text-secondary">Today's Routine</span>
                      <span class="badge-pastel ${stats.total > 0 && stats.done === stats.total ? 'badge-mint' : 'badge-peach'}">
                        ${stats.done} / ${stats.total} Done
                      </span>
                    </div>

                    <div class="d-flex flex-wrap gap-2 mb-2">
                      <a href="child-view.html?child_id=${child.id}" class="btn-pastel btn-pastel-mint flex-grow-1" style="min-height:44px;padding:0.5rem 0.9rem;font-size:0.9rem;">
                        Child View
                      </a>
                      <a href="schedule-creator.html?child_id=${child.id}" class="btn-pastel btn-pastel-sky flex-grow-1" style="min-height:44px;padding:0.5rem 0.9rem;font-size:0.9rem;">
                        Schedule
                      </a>
                    </div>

                    <div class="d-flex gap-2">
                      <button type="button" class="btn-pastel btn-pastel-glass flex-grow-1 edit-child-btn" data-id="${child.id}" style="min-height:40px;padding:0.4rem 0.75rem;font-size:0.85rem;">
                        Edit
                      </button>
                      <button type="button" class="btn-pastel btn-pastel-danger delete-child-btn" data-id="${child.id}" data-name="${escapeHtml(child.name)}" style="min-height:40px;padding:0.4rem 0.85rem;font-size:0.85rem;">
                        Delete
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            `;
          })
          .join('');

        document.querySelectorAll('.edit-child-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const found = childrenList.find((c) => String(c.id) === btn.getAttribute('data-id'));
            if (found) openChildModal(found);
          });
        });

        document.querySelectorAll('.delete-child-btn').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const id = btn.getAttribute('data-id');
            const name = btn.getAttribute('data-name');
            if (!confirm(`Delete ${name}'s profile and all their schedules?`)) return;
            try {
              await ChildrenAPI.remove(id, currentUser.id);
              showToast(`${name}'s profile was removed.`, 'peach');
              loadDashboard();
            } catch (err) {
              showToast(err.message || 'Could not delete profile.', 'rose');
            }
          });
        });
      } catch (err) {
        childrenGrid.innerHTML = `
          <div class="col-12">
            <div class="alert-box alert-error">${escapeHtml(err.message || 'Failed to load dashboard data.')}</div>
          </div>
        `;
      }
    }

    childForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      childFormAlert.classList.add('d-none');

      const id = document.getElementById('childIdInput').value;
      const name = document.getElementById('childNameInput').value.trim();
      const age = parseInt(document.getElementById('childAgeInput').value, 10);
      const delay_domain = document.getElementById('childDomainInput').value;
      const photo_url = document.getElementById('childPhotoInput').value.trim();
      const notes = document.getElementById('childNotesInput').value.trim();

      if (!name || isNaN(age) || age < 1) {
        childFormAlert.className = 'alert-box alert-error';
        childFormAlert.textContent = 'Please provide a valid child name and age.';
        childFormAlert.classList.remove('d-none');
        return;
      }

      const saveBtn = document.getElementById('saveChildBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        const payload = { user_id: currentUser.id, name, age, delay_domain, photo_url, notes };
        if (id) {
          await ChildrenAPI.update(id, payload);
          showToast(`${name}'s profile updated!`, 'mint');
        } else {
          await ChildrenAPI.create(payload);
          showToast(`${name}'s profile created!`, 'mint');
        }
        closeChildModal();
        loadDashboard();
      } catch (err) {
        childFormAlert.className = 'alert-box alert-error';
        childFormAlert.textContent = err.message || 'Could not save child profile.';
        childFormAlert.classList.remove('d-none');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Profile';
      }
    });

    loadDashboard();
  </script>
</body>
</html>
