<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KiddoPath — Database Check</title>
  <!-- ADDED: fonts + Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/pages-extra.css" rel="stylesheet" />
</head>
<body class="d-flex align-items-center py-4">
  <main class="container">
    <div class="row justify-content-center"><div class="col-lg-6">
      <div class="glass-card p-4 p-md-5">
        <!-- ADDED: public page (no login needed) to verify frontend -> PHP -> MySQL connection -->
        <div class="text-center mb-4">
          <span class="badge-pastel badge-sky mb-2">Diagnostics</span>
          <h2 class="h3 mb-1">Database Connection</h2>
          <p class="text-secondary small mb-0" id="apiUrl"></p>
        </div>
        <div id="result" class="mb-3"></div>
        <div class="d-flex gap-2 justify-content-between flex-wrap">
          <a href="index.html" class="btn-pastel btn-pastel-glass">Back</a>
          <button type="button" id="recheckBtn" class="btn-pastel btn-pastel-sky"><i class="fa-solid fa-rotate"></i> Check again</button>
        </div>
      </div>
    </div></div>
  </main>

  <script src="js/api.js"></script>
  <!-- ADDED: AuthAPI / UsersAPI / ChildrenAPI / SchedulesAPI / TasksAPI / HealthAPI (api.js left untouched) -->
  <script src="js/api-endpoints.js"></script>
  <script src="js/script.js"></script>
  <script src="js/page-init.js"></script>
  <script>
    const out = document.getElementById('result');
    document.getElementById('apiUrl').textContent = `Backend: ${API_BASE_URL}`;

    async function runCheck() {
      out.innerHTML = '<div class="alert-box alert-success">Checking...</div>';
      try {
        const { data } = await HealthAPI.check();
        const rows = Object.entries(data.tables).map(([name, count]) => count === null
          ? `<div class="setting-row"><span class="fw-semibold">${escapeHtml(name)}</span><span class="badge-pastel badge-peach">missing - import schema.sql</span></div>`
          : `<div class="setting-row"><span class="fw-semibold">${escapeHtml(name)}</span><span class="badge-pastel badge-mint">${count} row${count === 1 ? '' : 's'}</span></div>`).join('');
        out.innerHTML = `<div class="alert-box alert-success">Connected to <b>${escapeHtml(data.database)}</b> (MySQL ${escapeHtml(data.server)})</div>${rows}`;
      } catch (err) {
        out.innerHTML = `<div class="alert-box alert-error">${escapeHtml(err.message)}</div>`;
      }
    }
    document.getElementById('recheckBtn').addEventListener('click', runCheck);
    runCheck();
  </script>
</body>
</html>
