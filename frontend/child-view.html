<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KiddoPath — Child View</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <div id="appNavbar"></div>
  <main class="container page-main">
    <div class="page-header">
      <div><h1 class="h3 mb-1">Child View</h1><p class="text-secondary small mb-0">Big, calm, one-step-at-a-time routine.</p></div>
      <select id="childSelect" class="glass-select" style="max-width:240px" aria-label="Choose child"></select>
    </div>

    <div class="row">
      <div class="col-lg-7"><div class="child-task-hero text-center">
        <div id="heroEmpty" class="empty-state"></div>
        <div id="heroBody" class="d-none">
          <span class="badge-pastel badge-sky mb-2">Now</span>
          <div class="pastel-icon-tile tile-peach mb-2" style="margin:0 auto;width:84px;height:84px;font-size:2.2rem"><i id="heroIcon"></i></div>
          <h2 class="display-6 mb-1" id="heroName"></h2>
          <p class="text-secondary" id="heroTime"></p>
          <div class="pie-timer-ring mb-3" id="timerRing"><div class="pie-timer-inner"><span class="fw-bold fs-6" id="timerText">--:--</span></div></div>
          <div class="d-flex gap-2 justify-content-center flex-wrap">
            <button type="button" id="speakBtn" class="btn-pastel btn-pastel-lavender"><i class="fa-solid fa-volume-high"></i> Say it</button>
            <button type="button" id="timerBtn" class="btn-pastel btn-pastel-sky"></button>
            <button type="button" id="doneBtn" class="btn-pastel btn-pastel-mint"><i class="fa-solid fa-check"></i> All done!</button>
          </div>
        </div>
      </div></div>
      <div class="col-lg-5"><div class="glass-card p-4 h-100">
        <h2 class="h6 mb-3">Today's Routine</h2>
        <div id="timeline" class="d-flex flex-column gap-2"></div>
      </div></div>
    </div>

    <div class="glass-card p-4 mt-4">
      <h2 class="h6 mb-3">My Talking Board</h2>
      <div id="aacBoard" class="row"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/api-endpoints.js"></script>
  <script src="js/script.js"></script>
  <script>
    const user = initPage('child');
    let tasks = [], current = null, timerId = null, remaining = 0, total = 0;
    const START = '<i class="fa-solid fa-play"></i> Start timer';

    const AAC = [['I want water', 'glass-water', 'sky'], ['I am hungry', 'utensils', 'peach'], ['I need help', 'hand', 'rose'], ['Bathroom please', 'toilet', 'mint'],
      ['Yes', 'thumbs-up', 'mint'], ['No', 'thumbs-down', 'rose'], ['I am tired', 'bed', 'lavender'], ['I want to play', 'puzzle-piece', 'peach']];
    $('aacBoard').innerHTML = AAC.map(([text, icon, tile]) => `<div class="col-sm-4 col-md-3"><div class="aac-card" data-say="${text}" tabindex="0" role="button">
      <div class="pastel-icon-tile tile-${tile}"><i class="fa-solid fa-${icon}"></i></div><span class="fw-bold">${text}</span></div></div>`).join('');
    $('aacBoard').addEventListener('click', (e) => {
      const card = e.target.closest('.aac-card'); if (!card) return;
      card.classList.add('speaking'); speakText(card.dataset.say);
      setTimeout(() => card.classList.remove('speaking'), 700);
    });

    function drawTimer() {
      const pad = (n) => String(n).padStart(2, '0');
      $('timerText').textContent = total ? `${pad(Math.floor(remaining / 60))}:${pad(remaining % 60)}` : '--:--';
      $('timerRing').style.setProperty('--timer-deg', (total ? remaining / total * 360 : 360) + 'deg');
    }
    function stopTimer() { clearInterval(timerId); timerId = null; $('timerBtn').innerHTML = START; }

    function render() {
      stopTimer();
      current = tasks.find(t => t.status !== 'completed') || null;
      $('heroEmpty').classList.toggle('d-none', !!current);
      $('heroEmpty').textContent = tasks.length ? 'All tasks done. Great job!' : 'No schedule for today.';
      $('heroBody').classList.toggle('d-none', !current);
      if (current) {
        $('heroIcon').className = `fa-solid ${current.icon || 'fa-tasks'}`;
        $('heroName').textContent = current.name;
        $('heroTime').textContent = current.time ? formatTime12h(current.time) : '';
        total = remaining = (current.duration || 0) * 60;
        drawTimer();
      }
      $('timeline').innerHTML = tasks.map(t => `<div class="timeline-task-card ${t.status === 'completed' ? 'is-completed' : ''} ${t === current ? 'selected-task' : ''}">
        <div class="d-flex align-items-center gap-3"><i class="fa-solid ${escapeHtml(t.icon || 'fa-tasks')}"></i>
          <div class="flex-grow-1"><div class="fw-bold">${escapeHtml(t.name)}</div>
            <div class="small text-secondary">${t.time ? formatTime12h(t.time) : ''}${t.duration ? ' • ' + escapeHtml(t.duration) + ' min' : ''}</div></div>
          ${t.status === 'completed' ? '<i class="fa-solid fa-circle-check" style="color:var(--pastel-mint)"></i>' : ''}</div></div>`).join('') || '<div class="empty-state">Nothing scheduled.</div>';
    }

    async function loadToday() {
      tasks = [];
      try {
        const childId = $('childSelect').value;
        const schedule = childId && (await SchedulesAPI.list(user.id, childId)).find(s => s.date === getTodayISO());
        if (schedule) tasks = (await TasksAPI.list(user.id, schedule.id)).sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
      } catch (e) { showToast(e.message, 'rose'); }
      render();
    }

    $('speakBtn').onclick = () => speakText(current.name);
    $('timerBtn').onclick = () => {
      if (timerId) return stopTimer();
      if (!remaining) return showToast('This task has no duration set.', 'peach');
      $('timerBtn').innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
      timerId = setInterval(() => {
        remaining--; drawTimer();
        if (remaining <= 0) { stopTimer(); playSuccessChime(); speakText('Time is up!'); }
      }, 1000);
    };
    $('doneBtn').onclick = async () => {
      try { // PUT replaces the whole task, so resend it
        await TasksAPI.update(current.id, { ...current, user_id: user.id, status: 'completed' });
        playSuccessChime(); showToast('Great job!', 'mint'); loadToday();
      } catch (e) { showToast(e.message, 'rose'); }
    };
    $('childSelect').onchange = loadToday;

    (async () => {
      try {
        fillSelect($('childSelect'), await ChildrenAPI.list(user.id));
        const wanted = new URLSearchParams(location.search).get('child_id');
        if (wanted) $('childSelect').value = wanted;
      } catch (e) { showToast(e.message, 'rose'); }
      loadToday();
    })();
  </script>
</body>
</html>
