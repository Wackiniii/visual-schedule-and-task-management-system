<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KiddoPath — Progress</title>
  <!-- ADDED: fonts + Font Awesome (used by the navbar in script.js and the page icons) -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="css/style.css" rel="stylesheet" />
  <!-- ADDED: extra utilities/components, loaded after style.css -->
  <link href="css/pages-extra.css" rel="stylesheet" />
</head>
<body>
  <div id="appNavbar"></div>

  <main class="container page-main">
    <div class="page-header">
      <div>
        <h1 class="h3 mb-1">Progress</h1>
        <p class="text-secondary small mb-0">Task completion across schedules.</p>
      </div>
      <select id="childSelect" class="glass-select" style="max-width:240px" aria-label="Filter by child"></select>
    </div>

    <!-- ADDED: summary stats -->
    <div class="row mb-3">
      <div class="col-sm-4"><div class="glass-card stat-tile"><div class="pastel-icon-tile tile-lavender"><i class="fa-solid fa-calendar-days"></i></div><div><div class="stat-value" id="pSchedules">0</div><div class="small text-secondary">Schedules</div></div></div></div>
      <div class="col-sm-4"><div class="glass-card stat-tile"><div class="pastel-icon-tile tile-mint"><i class="fa-solid fa-circle-check"></i></div><div><div class="stat-value" id="pDone">0</div><div class="small text-secondary">Tasks completed</div></div></div></div>
      <div class="col-sm-4"><div class="glass-card stat-tile"><div class="pastel-icon-tile tile-sky"><i class="fa-solid fa-percent"></i></div><div><div class="stat-value" id="pRate">0%</div><div class="small text-secondary">Completion rate</div></div></div></div>
    </div>

    <!-- ADDED: per-day completion list (swap for a chart library later if wanted) -->
    <div class="glass-card p-4">
      <h2 class="h6 mb-3">Daily Completion</h2>
      <div id="dayList" class="d-flex flex-column gap-3"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <!-- ADDED: AuthAPI / ChildrenAPI / SchedulesAPI / TasksAPI (api.js left untouched) -->
  <script src="js/api-endpoints.js"></script>
  <script src="js/script.js"></script>
  <!-- ADDED: shared page bootstrap (auth guard + navbar) -->
  <script src="js/page-init.js"></script>
  <script>
    const user = initPage('progress');
    const $ = (id) => document.getElementById(id);

    async function loadProgress() {
      const childId = $('childSelect').value;
      try {
        let schedules = await SchedulesAPI.list(user.id, childId || null);
        const ids = new Set(schedules.map(s => s.id));
        const tasks = (await TasksAPI.list(user.id)).filter(t => ids.has(t.schedule_id));
        const done = tasks.filter(t => t.status === 'completed').length;
        $('pSchedules').textContent = schedules.length;
        $('pDone').textContent = done;
        $('pRate').textContent = (tasks.length ? Math.round(done / tasks.length * 100) : 0) + '%';

        $('dayList').innerHTML = schedules.slice().reverse().map(s => {
          const st = tasks.filter(t => t.schedule_id === s.id), d = st.filter(t => t.status === 'completed').length;
          const pct = st.length ? Math.round(d / st.length * 100) : 0;
          return `<div>
            <div class="d-flex justify-content-between small fw-semibold mb-1"><span>${escapeHtml(s.date)}</span><span>${d}/${st.length} tasks (${pct}%)</span></div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          </div>`;
        }).join('') || '<div class="empty-state">No schedules yet.</div>';
      } catch (err) { showToast(err.message, 'rose'); }
    }

    $('childSelect').addEventListener('change', loadProgress);
    (async () => {
      try {
        const children = await ChildrenAPI.list(user.id);
        fillSelect($('childSelect'), children, c => c.name, 'All children');
      } catch (err) { showToast(err.message, 'rose'); }
      loadProgress();
    })();
  </script>
</body>
</html>
